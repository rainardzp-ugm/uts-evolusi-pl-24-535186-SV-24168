name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-backend:
    name: Test Backend (Laravel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, json, openssl, tokenizer, xml
          coverage: none

      - name: Copy Environment File
        run: |
          cd backend
          cp .env.example .env

      - name: Install Dependencies
        run: |
          cd backend
          composer install --ignore-platform-reqs --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Application Key
        run: |
          cd backend
          php artisan key:generate

      - name: Run Backend Tests
        run: |
          cd backend
          php artisan test

  build-frontend:
    name: Build Frontend (Vue.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build
  
  deploy:
      name: Deploy to Production
      needs: [test-backend, build-frontend]
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'

      steps:
        - name: Checkout Code
          uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and Push Backend Image
          uses: docker/build-push-action@v5
          with:
            context: ./backend
            push: true
            tags: ghcr.io/${{ github.repository }}/backend:latest

        - name: Build and Push Frontend Image
          uses: docker/build-push-action@v5
          with:
            context: ./frontend
            push: true
            tags: ghcr.io/${{ github.repository }}/frontend:latest